[package]
name = "goat-player-3ds"
description = "Nintendo 3DS player: the sample game as a .3dsx (build: `goat build 3ds`)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "goat-hello"
path = "src/main.rs"


[dependencies]
goat-platform-3ds.workspace = true
# no TypeScript compiler on the console: `goat build 3ds` ships the compiled JavaScript
hello-game = { path = "../../games/hello", default-features = false }

# assets packed into the .3dsx (read at run time from romfs:/): staged by `goat build 3ds`
# (games/hello/assets with the scripts compiled to JavaScript)
[package.metadata.cargo-3ds]
romfs_dir = "../../target/3ds-romfs"
