[package]
name = "goat-script-js"
description = "GoatEngine TypeScript / JavaScript scripting: a Boa (pure Rust) host running ES modules that import the engine API from \"goat\"; TypeScript compiled by oxc (feature `typescript`; builds for consoles ship the compiled JavaScript)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
goat-core.workspace = true
goat-runtime.workspace = true
goat-assets.workspace = true
goat-script.workspace = true
serde_json.workspace = true
boa_engine = { version = "0.22", default-features = false }
oxc_allocator = { version = ">=0.100, <0.161", optional = true }
oxc_parser = { version = ">=0.100, <0.161", optional = true }
oxc_span = { version = ">=0.100, <0.161", optional = true }
oxc_semantic = { version = ">=0.100, <0.161", optional = true }
oxc_transformer = { version = ">=0.100, <0.161", optional = true }
oxc_codegen = { version = ">=0.100, <0.161", optional = true }

[features]
default = ["typescript"]
# compile .ts at load time (desktop, editor, build tools); console builds load precompiled .js
typescript = ["dep:oxc_allocator", "dep:oxc_parser", "dep:oxc_span", "dep:oxc_semantic", "dep:oxc_transformer", "dep:oxc_codegen"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { version = "0.22", default-features = false, features = ["js"] }

[dev-dependencies]
goat-gfx.workspace = true
goat-scene.workspace = true
goat-tween = { workspace = true, features = ["script"] }
goat-physics = { workspace = true, features = ["script"] }
