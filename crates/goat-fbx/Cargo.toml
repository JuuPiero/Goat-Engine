[package]
name = "goat-fbx"
description = "GoatEngine FBX → glTF (GLB) converter (host tools: editor, goat build, desktop player): ufbx reads FBX / OBJ, the engine's model data is written as GLB so every platform (3DS included) loads it."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goat-core.workspace = true
goat-gfx.workspace = true
goat-assets.workspace = true
ufbx = "0.11"
serde_json = "1"
