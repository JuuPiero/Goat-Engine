[package]
name = "goat-ui"
description = "GoatEngine UI (Unity UGUI-like): Canvas per display, RectTransform anchors / pivots, Image (sliced / filled), Text, Button, Toggle, Slider, InputField, Dropdown, ScrollRect, layout groups, masks; touch / mouse / D-pad navigation; drawn in one batched pass per canvas."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goat-core.workspace = true
goat-gfx.workspace = true
goat-runtime.workspace = true
goat-assets.workspace = true
goat-sprites.workspace = true
goat-text.workspace = true
hecs.workspace = true
serde.workspace = true
serde_json.workspace = true
goat-scene = { workspace = true, optional = true }
goat-script = { workspace = true, optional = true }

[features]
# UI components in scene / prefab files
scene = ["dep:goat-scene"]
# UI.* calls for scripts (clicks, values)
script = ["dep:goat-script"]
